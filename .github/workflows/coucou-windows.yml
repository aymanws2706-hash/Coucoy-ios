name: Build Coucou for Windows

# Builds the original Coucou desktop app (github.com/Louis-CFM/coucou, MIT) for
# Windows on GitHub's free Windows runners and publishes it as the
# "coucou-windows" release: an MSI, a setup.exe, and a portable zip.
# Unsigned, so Windows SmartScreen warns on first run (More info > Run anyway).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/coucou-windows.yml", "desktop/**"]

permissions:
  contents: write

env:
  COUCOU_SHA: f4bfb499d852d63e824853ec9c027b57e70bbc5a

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Get Coucou at the pinned commit
        shell: pwsh
        run: |
          git init -q coucou
          cd coucou
          git remote add origin https://github.com/Louis-CFM/coucou.git
          git fetch -q --depth 1 origin $env:COUCOU_SHA
          git checkout -q FETCH_HEAD
          git log -1 --format="%h %s"

      # Personal build: the files in desktop/overlay replace or add to
      # Coucou's own. They carry the always-visible notch with the clock and PC
      # stats, the "This PC" panel the island opens on, and the settings window
      # that re-centres itself. See desktop/README.md.
      - uses: actions/checkout@v4
        with:
          path: mine
          sparse-checkout: desktop

      - name: Apply the personal changes
        shell: bash
        run: |
          cp -rv mine/desktop/overlay/. coucou/windows/
          grep -q "mod sysstats" coucou/windows/src-tauri/src/lib.rs

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            coucou/windows/target
          key: coucou-win-cargo-${{ env.COUCOU_SHA }}
          restore-keys: coucou-win-cargo-

      - name: Install dependencies
        working-directory: coucou/windows
        run: npm ci

      - name: Build the installers
        working-directory: coucou/windows
        shell: pwsh
        run: |
          npm run pack
          Get-ChildItem release | Format-Table Name, Length

      - name: Collect the files
        id: files
        shell: pwsh
        run: |
          $v = (Get-Content coucou/windows/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory out | Out-Null
          Copy-Item "coucou/windows/release/Putshi-Windows-$v.msi" out/Putshi-Windows.msi
          Copy-Item "coucou/windows/release/Putshi-Windows-$v-setup.exe" out/Putshi-Windows-setup.exe
          New-Item -ItemType Directory portable | Out-Null
          # The app binary is named after the product (Putshi.exe) or the crate (coucou.exe).
          $exe = @("coucou/windows/target/release/Putshi.exe", "coucou/windows/target/release/coucou.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          Copy-Item $exe portable/Putshi.exe
          Copy-Item coucou/windows/target/release/coucou-hook.exe portable/
          Compress-Archive -Path portable/* -DestinationPath out/Putshi-Windows-portable.zip
          Get-ChildItem out | Format-Table Name, Length
          "version=$v" >> $env:GITHUB_OUTPUT

      # Start the release fresh so files from older builds (Coucou-*) don't linger.
      - name: Clear the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release delete coucou-windows --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true

      - name: Publish the coucou-windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: coucou-windows
          name: "Putshi for Windows ${{ steps.files.outputs.version }} (personal build of Coucou)"
          body: |
            Putshi for Windows: a personal build of the Coucou desktop app by Louis Raillé (MIT), from commit ${{ env.COUCOU_SHA }} with the changes in desktop/.

            Pick one:
            - **Putshi-Windows.msi**: Windows Installer, recommended.
            - **Putshi-Windows-setup.exe**: the other installer.
            - **Putshi-Windows-portable.zip**: no install; unzip and run Putshi.exe.

            It isn't code-signed, so Windows shows "Windows protected your PC": click **More info › Run anyway**.
            Uninstall "Coucou" first if an older build is installed.
          files: out/*
          make_latest: false
