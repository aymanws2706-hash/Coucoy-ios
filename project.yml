# XcodeGen spec — the GitHub workflow turns this into an Xcode project on a Mac
# runner, builds it unsigned, and packages Coucou.ipa for sideloading.
name: Putshi
options:
  bundleIdPrefix: com.aymanws
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # Unsigned build: Sideloadly / AltStore sign it with your own Apple ID.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Putshi:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Sources/CoucouKit
      - path: Resources/Assets.xcassets
      # Fetched at build time from the Coucou repo (see the workflow).
      - path: Resources/sounds
        type: folder
        optional: true
    info:
      path: Resources/App-Info.plist
      properties:
        CFBundleDisplayName: Putshi
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.aymanws.putshi
            CFBundleURLSchemes:
              - putshi
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aymanws.putshi
        PRODUCT_NAME: Putshi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PutshiWidget
        embed: true

  PutshiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
      - path: Sources/CoucouKit
      - path: Sources/WidgetSupport
    info:
      path: Resources/Widget-Info.plist
      properties:
        CFBundleDisplayName: Putshi
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aymanws.putshi.widget
        PRODUCT_NAME: PutshiWidget
        SKIP_INSTALL: YES
